name: Code metrics

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  metrics:
    name: .NET code metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout DeltaECS
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaECS
          path: DeltaECS
      - name: Checkout DeltaXAML
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaXAML
          path: DeltaXAML
      - name: Checkout DeltaText
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaText
          path: DeltaText
      - name: Checkout DeltaRender
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaRender
          path: DeltaRender
      - name: Checkout DeltaShader
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaShader
          path: DeltaShader
      - name: Checkout DeltaDiagnostics
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaDiagnostics
          path: DeltaDiagnostics
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Restore
        run: dotnet restore src/DeltaEngine.slnx
      - name: Verify formatting
        continue-on-error: true
        run: |
          mkdir -p artifacts/code-metrics
          dotnet format whitespace --folder . --exclude ./obj ./bin --verify-no-changes --verbosity minimal 2>&1 | tee artifacts/code-metrics/format.log
      - name: Build and collect analyzer metrics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/code-metrics; set +e
          ./eng/code-metrics.sh 2>&1 | tee artifacts/code-metrics/build.log
          status=${PIPESTATUS[0]}; set -e
          echo "Build exit code: $status" | tee artifacts/code-metrics/summary.txt; exit 0
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-metrics
          path: artifacts/code-metrics
          if-no-files-found: warn
