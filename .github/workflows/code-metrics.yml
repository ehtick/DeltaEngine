name: Code metrics

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  metrics:
    name: .NET code metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout DeltaECS
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaECS
          path: DeltaECS
      - name: Checkout DeltaXAML
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaXAML
          path: DeltaXAML
      - name: Checkout DeltaRender
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaRender
          path: DeltaRender
      - name: Checkout DeltaShader
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaShader
          path: DeltaShader
      - name: Checkout DeltaDiagnostics
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaDiagnostics
          path: DeltaDiagnostics
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Prepare pinned SixLabors.Fonts package
        env:
          FONTS_SHA: c68b27d683c701ca254d5cfc6487c699954f19ff
        run: |
          set -euo pipefail
          fonts_dir="$RUNNER_TEMP/fonts"
          feed_dir="$RUNNER_TEMP/nuget"
          git clone --filter=blob:none --no-checkout https://github.com/Artromskiy/Fonts.git "$fonts_dir"
          git -C "$fonts_dir" fetch --depth=1 origin "$FONTS_SHA"
          git -C "$fonts_dir" checkout --detach "$FONTS_SHA"
          git -C "$fonts_dir" submodule update --init --recursive
          mkdir -p "$feed_dir"
          dotnet restore "$fonts_dir/src/SixLabors.Fonts/SixLabors.Fonts.csproj" \
            --configfile "$GITHUB_WORKSPACE/NuGet.Config" --no-cache
          dotnet pack "$fonts_dir/src/SixLabors.Fonts/SixLabors.Fonts.csproj" \
            --configuration Release --no-restore --output "$feed_dir" \
            -p:PackageId=SixLabors.Fonts.Delta \
            -p:PackageVersion=3.1.0-source.c68b27d
          cat > "$RUNNER_TEMP/NuGet.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="sixlabors-fonts" value="$feed_dir" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF
      - name: Restore
        run: dotnet restore src/DeltaEngine.slnx --configfile "$RUNNER_TEMP/NuGet.Config" --no-cache --force-evaluate
      - name: Verify formatting
        continue-on-error: true
        run: |
          mkdir -p artifacts/code-metrics
          dotnet format whitespace --folder . --exclude ./obj --exclude ./bin --exclude ./artifacts --verify-no-changes --verbosity minimal 2>&1 | tee artifacts/code-metrics/format.log
      - name: Build and collect analyzer metrics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/code-metrics; set +e
          dotnet build src/DeltaEngine.slnx -c Release --no-restore \
            --disable-build-servers -m:1 /p:UseSharedCompilation=false \
            /p:AnalysisMode=AllEnabledByDefault \
            "/p:ErrorLog=${GITHUB_WORKSPACE}/artifacts/code-metrics/diagnostics.sarif,version=2.1" \
            2>&1 | tee artifacts/code-metrics/build.log
          status=${PIPESTATUS[0]}; set -e
          echo "Build exit code: $status" | tee artifacts/code-metrics/summary.txt; exit 0
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-metrics
          path: artifacts/code-metrics
          if-no-files-found: warn
