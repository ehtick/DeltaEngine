name: Build, tests and benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run registered BenchmarkDotNet projects
        required: true
        default: false
        type: boolean
      filter:
        description: BenchmarkDotNet filter
        required: true
        default: "*"
        type: string
      warmup_count:
        required: true
        default: 3
        type: number
      iteration_count:
        required: true
        default: 5
        type: number
      launch_count:
        required: true
        default: 1
        type: number

permissions:
  contents: read
  packages: read

concurrency:
  group: delta-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout DeltaEngine
        uses: actions/checkout@v7
        with:
          path: DeltaEngine
      - name: Checkout DeltaECS
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaECS
          path: DeltaECS
      - name: Checkout DeltaXAML
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaXAML
          path: DeltaXAML
      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Prepare pinned SixLabors.Fonts package
        env:
          FONTS_SHA: c68b27d683c701ca254d5cfc6487c699954f19ff
        run: |
          set -euo pipefail
          fonts_dir="$RUNNER_TEMP/fonts"
          feed_dir="$RUNNER_TEMP/nuget"
          git clone --filter=blob:none --no-checkout https://github.com/Artromskiy/Fonts.git "$fonts_dir"
          git -C "$fonts_dir" fetch --depth=1 origin "$FONTS_SHA"
          git -C "$fonts_dir" checkout --detach "$FONTS_SHA"
          git -C "$fonts_dir" submodule update --init --recursive
          mkdir -p "$feed_dir"
          dotnet restore "$fonts_dir/src/SixLabors.Fonts/SixLabors.Fonts.csproj" \
            --configfile "$GITHUB_WORKSPACE/DeltaEngine/NuGet.Config" --no-cache
          dotnet pack "$fonts_dir/src/SixLabors.Fonts/SixLabors.Fonts.csproj" \
            --configuration Release --no-restore --output "$feed_dir" \
            -p:PackageId=SixLabors.Fonts.Delta \
            -p:PackageVersion=3.1.0-source.c68b27d
          cat > "$RUNNER_TEMP/NuGet.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="sixlabors-fonts" value="$feed_dir" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-engine-nuget-${{ runner.os }}-${{ hashFiles('DeltaEngine/**/*.csproj', 'DeltaECS/**/*.csproj', 'DeltaXAML/**/*.csproj') }}
          restore-keys: delta-engine-nuget-${{ runner.os }}-
      - name: Restore and build stable headless contracts
        working-directory: DeltaEngine
        run: |
          # Resolve floating first-party packages from the checked-in public
          # NuGet.org-only config, never from runner-global/private sources.
          dotnet restore src/DeltaEngine.Integration.Tests/DeltaEngine.Integration.Tests.csproj \
            --configfile "$RUNNER_TEMP/NuGet.Config" --no-cache --force-evaluate
          dotnet build src/DeltaEngine.Integration.Tests/DeltaEngine.Integration.Tests.csproj -c Release --no-restore
      - name: Run tests
        working-directory: DeltaEngine
        run: dotnet test src/DeltaEngine.Integration.Tests/DeltaEngine.Integration.Tests.csproj -c Release --no-build --no-restore

  benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FILTER: ${{ inputs.filter || '*' }}
      WARMUP_COUNT: ${{ inputs.warmup_count || 3 }}
      ITERATION_COUNT: ${{ inputs.iteration_count || 5 }}
      LAUNCH_COUNT: ${{ inputs.launch_count || 1 }}
    steps:
      - name: Checkout DeltaEngine
        uses: actions/checkout@v7
        with:
          path: DeltaEngine
      - name: Checkout DeltaECS
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaECS
          path: DeltaECS
      - name: Checkout DeltaXAML
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaXAML
          path: DeltaXAML
      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run registered benchmarks
        working-directory: DeltaEngine
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks
          mapfile -t projects < <(find . -type f -name '*.Benchmarks.csproj' | sort)
          if [ ${#projects[@]} -eq 0 ]; then
            echo 'No *.Benchmarks.csproj is registered.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for project in "${projects[@]}"; do
            dotnet run --project "$project" -c Release -- \
              --filter "$FILTER" \
              --warmupCount "$WARMUP_COUNT" \
              --iterationCount "$ITERATION_COUNT" \
              --launchCount "$LAUNCH_COUNT" \
              --exporters json csv markdown github \
              --artifacts artifacts/benchmarks
          done
      - name: Add reports to workflow summary
        if: always()
        working-directory: DeltaEngine
        shell: bash
        run: |
          while IFS= read -r report; do
            echo "## $(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,180p' "$report" >> "$GITHUB_STEP_SUMMARY"
          done < <(find artifacts/benchmarks -type f -name '*-report-github.md' | sort)
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delta-engine-benchmarks-${{ runner.arch }}-${{ github.run_number }}
          path: DeltaEngine/artifacts/benchmarks
          if-no-files-found: warn
          retention-days: 30
